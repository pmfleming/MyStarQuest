name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'public/prototypes/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'public/prototypes/**'

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check Formatting
        run: npm run format:check
      - name: Run Linter
        run: npm run lint

  type-check:
    name: Build & Type Check
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: test-app-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web application
        run: npm run build
      - name: Install function dependencies
        run: npm ci --prefix functions
      - name: Build functions
        run: npm run build --prefix functions

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    env:
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest
        run: npm run test

  quality:
    name: TypeScript quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VITEST_MAX_WORKERS: '2'
      QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      QUALITY_LENS_CLI: tmp/quality-lens-latest/dist/bin/ts-react-quality-lens.js
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check out pinned TypeScript Lens
        uses: actions/checkout@v4
        with:
          repository: pmfleming/ts-react-quality-lens
          ref: 986c6fd9cc82627866156ba0cf22cb1504ab8587
          path: tmp/quality-lens-latest
          persist-credentials: false
      - name: Build Lens
        run: npm ci --prefix tmp/quality-lens-latest && npm run build --prefix tmp/quality-lens-latest
      - name: Test quality report checks
        run: node --test scripts/quality-summary.test.mjs scripts/quality-gate.integration.test.mjs
      - name: Audit changed code and report metrics
        run: node scripts/quality-gate.mjs "$QUALITY_BASE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typescript-quality
          path: target/analysis/*.*
          retention-days: 30

  e2e-tests:
    name: E2E Tests (Playwright)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: test-app-id
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
