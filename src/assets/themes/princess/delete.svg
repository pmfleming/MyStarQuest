  <path d="M104 73L106 77L110 79L106 81L104 85L102 81L98 79L102 77Z" fill="#FFF2B8" stroke="#B77478" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="112" cy="91" r="3" fill="#F3B0C7" stroke="#9A5B72" stroke-width="1.5"/>
  <circle cx="105" cy="100" r="2" fill="#FFF2C4" stroke="#C18375" stroke-width="1.5"/>
