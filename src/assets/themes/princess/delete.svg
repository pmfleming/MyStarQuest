<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Royal task delete</title>
  <desc id="desc">A royal task card marked with a bold ribbon X and dissolving into sparkles.</desc>
  <defs>
    <linearGradient id="card" x1="21" y1="20" x2="99" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8EC"/>
      <stop offset="1" stop-color="#F5C9DA"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="42" y1="45" x2="82" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7B5CC"/>
      <stop offset="0.55" stop-color="#E17AA6"/>
      <stop offset="1" stop-color="#BE5688"/>
    </linearGradient>
    <linearGradient id="gold" x1="75" y1="20" x2="103" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4B4"/>
      <stop offset="0.55" stop-color="#FFD269"/>
      <stop offset="1" stop-color="#E4A03A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#784760" flood-opacity="0.3"/>
    </filter>
  </defs>

  <path d="M34 20H78L98 40V98C98 105 93 110 86 110H34C27 110 22 105 22 98V32C22 25 27 20 34 20Z" fill="url(#card)" stroke="#8B506A" stroke-width="4" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M78 20V35C78 39 81 42 85 42H98" fill="url(#gold)" stroke="#8B506A" stroke-width="4" stroke-linejoin="round"/>
  <path d="M38 35H66" fill="none" stroke="#E3A0B7" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <path d="M42 51L79 88" fill="none" stroke="#824D68" stroke-width="14" stroke-linecap="round"/>
    <path d="M79 51L42 88" fill="none" stroke="#824D68" stroke-width="14" stroke-linecap="round"/>
    <path d="M42 51L79 88" fill="none" stroke="url(#ribbon)" stroke-width="8" stroke-linecap="round"/>
    <path d="M79 51L42 88" fill="none" stroke="url(#ribbon)" stroke-width="8" stroke-linecap="round"/>
    <path d="M47 53L76 82" fill="none" stroke="#FFDDEA" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <path d="M105 31V42M99.5 36.5H110.5" stroke="#E5A23C" stroke-width="3" stroke-linecap="round"/>
