<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Royal task edit</title>
  <desc id="desc">A jeweled pink pencil writing on a small royal task card.</desc>
