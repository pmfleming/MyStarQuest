<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Royal orbit reset</title>
  <desc id="desc">A golden star leading layered pink and gold comet trails around a circular reset arrow.</desc>
  <defs>
    <linearGradient id="orbit" x1="18" y1="18" x2="105" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7C6D8"/>
      <stop offset="0.55" stop-color="#E88FB4"/>
      <stop offset="1" stop-color="#C76598"/>
    </linearGradient>
    <linearGradient id="gold" x1="78" y1="18" x2="110" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4B8"/>
      <stop offset="0.5" stop-color="#FFD76A"/>
      <stop offset="1" stop-color="#E8A638"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#7D3F68" flood-opacity="0.28"/>
    </filter>
  </defs>

  <path d="M88 37C77 24 60 18 45 22C22 28 12 52 20 73C28 96 53 108 76 99C92 93 101 82 104 68"
        fill="none" stroke="#8E536E" stroke-width="11" stroke-linecap="round"/>
  <path d="M88 37C77 24 60 18 45 22C22 28 12 52 20 73C28 96 53 108 76 99C92 93 101 82 104 68"
        fill="none" stroke="url(#orbit)" stroke-width="7" stroke-linecap="round"/>

  <!-- Layered, diminishing streaks make the orbit feel like a magical star trail. -->
  <path d="M86 34C75 25 61 21 48 24C34 27 24 38 20 51"
        fill="none" stroke="#E6A546" stroke-width="4" stroke-linecap="round"/>
  <path d="M83 31C73 25 62 23 52 25C43 27 35 32 30 39"
        fill="none" stroke="#FFF4C9" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M74 38C64 33 53 33 44 36"
        fill="none" stroke="#FFEAF3" stroke-width="2" stroke-linecap="round"/>
  <path d="M94 61L108 66L102 80" fill="url(#orbit)" stroke="#8E536E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M92 14L97 26L110 27L100 36L103 49L92 42L80 49L83 36L73 27L87 26Z"
        fill="url(#gold)" stroke="#9B5D63" stroke-width="3.5" stroke-linejoin="round" filter="url(#shadow)"/>
  <path d="M88 25L92 18L95 27" fill="none" stroke="#FFF9D9" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M42 27V35M38 31H46" stroke="#FFF2C1" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M27 44V50M24 47H30" stroke="#F5C1D6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="27" cy="89" r="2.8" fill="#FFF5D2" stroke="#C88977" stroke-width="2"/>
  <circle cx="20" cy="63" r="2.2" fill="#FFF5D2" stroke="#C88977" stroke-width="1.5"/>
</svg>
